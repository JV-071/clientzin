name: Windows CMake

on:
  push:
    branches: [main, restore-first-login]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cmake-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: clear;files,D:/clientzin-cache/vcpkg,readwrite
  VCPKG_DEFAULT_TRIPLET: x64-windows-static
  VCPKG_DOWNLOADS: D:/clientzin-cache/downloads
  SCCACHE_DIR: D:/clientzin-cache/sccache
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_BASEDIRS: ${{ github.workspace }}
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  dependencies:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Inspect runtime contract
        run: python tools/audit_runtime.py
      - name: Verify binary package allowlist
        run: python tools/test_package_client.py
      - name: Set cache identity
        id: identity
        shell: pwsh
        run: |
          $compiler = (Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force D:/clientzin-cache/vcpkg | Out-Null
          New-Item -ItemType Directory -Force $env:VCPKG_DOWNLOADS | Out-Null
      - name: Restore downloaded dependency tools and sources
        uses: actions/cache/restore@v4
        id: downloads
        with:
          path: D:/clientzin-cache/downloads
          key: downloads-v1-windows-9e593bb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            downloads-v1-windows-9e593bb-
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: D:/clientzin-cache/vcpkg
          key: deps-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deps-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/cache/restore@v4
        id: dependency-objects
        with:
          path: D:/clientzin-cache/sccache
          key: dep-objects-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dep-objects-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}-
      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: .ci/vcpkg
      - name: Install dependencies once for all four builds
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = Join-Path $env:GITHUB_WORKSPACE '.ci/vcpkg'
          & ./.ci/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $attemptLog = "diagnostics/vcpkg-attempt-$attempt.log"
            & ./.ci/vcpkg/vcpkg.exe install --triplet x64-windows-static --clean-after-build 2>&1 | Tee-Object $attemptLog
            $installExit = $LASTEXITCODE
            Copy-Item -LiteralPath $attemptLog -Destination diagnostics/vcpkg.log
            if ($installExit -eq 0) { exit 0 }
            $downloadFailed = (Get-Content -LiteralPath $attemptLog -Raw) -match 'curl operation failed|Failed to download|SSL connect error'
            if (-not $downloadFailed -or $attempt -eq 3) { exit $installExit }
            Write-Warning "Dependency download failed on attempt $attempt; retrying with completed work retained."
            Start-Sleep -Seconds 15
          }
      - name: Stop cache server and report statistics
        id: dependency-cache-state
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats 2>&1 | Tee-Object diagnostics/dependency-cache.txt
          sccache --stop-server
          if ($LASTEXITCODE -ne 0) { Write-Warning "Cache server was already stopped or unavailable; see cache statistics above." }
          $hasObjects = (Test-Path -LiteralPath $env:SCCACHE_DIR -PathType Container) -and
            ($null -ne (Get-ChildItem -LiteralPath $env:SCCACHE_DIR -File -Recurse | Select-Object -First 1))
          "has-objects=$($hasObjects.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $hasObjects) { Write-Output "No compiler objects to save; dependencies may have been restored from the binary cache." }
          exit 0
      - name: Save completed work even on failure
        if: always() && steps.cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: D:/clientzin-cache/vcpkg
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Save downloaded dependency tools and sources even on failure
        if: always() && steps.downloads.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: D:/clientzin-cache/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: always() && steps.dependency-objects.outputs.cache-primary-key != '' && steps.dependency-cache-state.outputs.has-objects == 'true'
        with:
          path: D:/clientzin-cache/sccache
          key: ${{ steps.dependency-objects.outputs.cache-primary-key }}
      - name: Summarize failures and cache reuse
        if: always()
        run: python tools/summarize_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-diagnostics
          path: |
            diagnostics/
            .ci/vcpkg/buildtrees/**/*.log
          retention-days: 14

  build:
    needs: dependencies
    name: windows-cmake-${{ matrix.configuration }}-${{ matrix.renderer }}
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        configuration: [debug, release]
        renderer: [d3d9, d3d11]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Prepare diagnostics and cache identity
        id: identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $compiler = (Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion
          "compiler=$compiler" >> $env:GITHUB_OUTPUT
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/.ci/vcpkg" >> $env:GITHUB_ENV
          "Compiler: $compiler" | Tee-Object diagnostics/environment.txt
          cmake --version | Tee-Object -Append diagnostics/environment.txt
          sccache --version | Tee-Object -Append diagnostics/environment.txt
      - name: Restore downloaded dependency tools and sources
        uses: actions/cache/restore@v4
        with:
          path: D:/clientzin-cache/downloads
          key: downloads-v1-windows-9e593bb-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            downloads-v1-windows-9e593bb-
      - uses: actions/cache/restore@v4
        with:
          path: D:/clientzin-cache/vcpkg
          key: deps-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deps-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ hashFiles('vcpkg.json') }}-
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        id: objects
        with:
          path: D:/clientzin-cache/sccache
          key: objects-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ matrix.configuration }}-${{ matrix.renderer }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-v2-static-windows2022-${{ steps.identity.outputs.compiler }}-${{ matrix.configuration }}-${{ matrix.renderer }}-${{ hashFiles('vcpkg.json') }}-
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          path: .ci/vcpkg
      - name: Configure
        shell: pwsh
        run: |
          & ./.ci/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --preset windows-cmake-${{ matrix.configuration }}-${{ matrix.renderer }} 2>&1 | Tee-Object diagnostics/configure.log
          exit $LASTEXITCODE
      - name: Compile
        shell: pwsh
        run: |
          cmake --build --preset windows-cmake-${{ matrix.configuration }}-${{ matrix.renderer }} --parallel 4 -- -k 0 2>&1 | Tee-Object diagnostics/build.log
          exit $LASTEXITCODE
      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --preset windows-cmake-${{ matrix.configuration }}-${{ matrix.renderer }} --verbose --timeout 60 2>&1 | Tee-Object diagnostics/tests.log
          exit $LASTEXITCODE
      - name: Package executable and matching PDB only
        shell: pwsh
        run: |
          python tools/package_client.py --build build/windows-cmake-${{ matrix.configuration }}-${{ matrix.renderer }} --output package
          exit $LASTEXITCODE
      - name: Inspect executable DLL dependencies
        shell: pwsh
        run: |
          $exe = (Get-ChildItem package/Clientzin-*.exe).FullName
          dumpbin /DEPENDENTS $exe 2>&1 | Tee-Object diagnostics/executable-dependencies.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $imports = Get-Content diagnostics/executable-dependencies.txt -Raw
          if ($imports -match '(?i)(libEGL|libGLESv2|lua51|OpenAL32|zlib1|MSVCP[0-9]+D?|VCRUNTIME[0-9]+(?:_1)?D?|ucrtbased)\.dll') {
            throw 'Unexpected dynamic dependency in the static client; see executable-dependencies.txt'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Clientzin-${{ matrix.configuration }}-${{ matrix.renderer }}
          path: package/
          if-no-files-found: error
          retention-days: 14
      - name: Capture cache statistics
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats 2>&1 | Tee-Object diagnostics/compiler-cache.txt
          sccache --stop-server
          if ($LASTEXITCODE -ne 0) { Write-Warning "Cache server was already stopped or unavailable; see cache statistics above." }
          exit 0
      - name: Save compiler results even on failure
        if: always() && steps.objects.outputs.cache-primary-key != ''
        uses: actions/cache/save@v4
        with:
          path: D:/clientzin-cache/sccache
          key: ${{ steps.objects.outputs.cache-primary-key }}
      - name: Summarize failures and cache reuse
        if: always()
        run: python tools/summarize_build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.configuration }}-${{ matrix.renderer }}
          path: |
            diagnostics/
            build/**/CMakeCache.txt
            build/**/CMakeConfigureLog.yaml
            build/**/Testing/Temporary/*.log
          retention-days: 14
